<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ニャウンサー オンライン・グループドラフト Ver.5.0</title>
  <style>

:root{
  --bg:#07101f;
  --panel:#0d1728;
  --panel2:#111e32;
  --line:rgba(255,255,255,.09);
  --text:#f4f6fb;
  --muted:#8fa0b8;
  --gold:#d9b66f;
  --gold2:#f1d28c;
  --red:#e4525d;
  --green:#53c28b;
  --blue:#66a8ff;
  --shadow:0 18px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 20% 10%, rgba(48,91,153,.18), transparent 28%),
  radial-gradient(circle at 80% 0%, rgba(191,145,58,.12), transparent 22%),
  var(--bg); color:var(--text);
  font-family:Inter, "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
}
body{min-height:100vh;overflow-x:hidden}
.noise{
  pointer-events:none;position:fixed;inset:0;opacity:.025;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
}
.topbar{position:sticky;top:0;z-index:50;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(7,16,31,.82);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand-mark{width:38px;height:38px;border:1px solid rgba(217,182,111,.55);display:grid;place-items:center;color:var(--gold2);font-family:Georgia,serif;font-size:22px;background:linear-gradient(135deg,rgba(217,182,111,.16),rgba(255,255,255,.03));box-shadow:inset 0 0 25px rgba(217,182,111,.08)}
.brand-title{font-weight:800;letter-spacing:.08em}
.brand-sub{font-size:10px;letter-spacing:.23em;color:var(--gold);margin-top:2px}
.top-actions{display:flex;align-items:center;gap:14px}
.sync-badge{font-size:11px;color:var(--green);letter-spacing:.12em}
.app{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:34px 28px 80px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:stretch}
.hero-main,.hero-side,.panel,.glass{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));box-shadow:var(--shadow)}
.hero-main{min-height:390px;padding:56px;position:relative;overflow:hidden}
.hero-main:after{content:"DRAFT";position:absolute;right:-14px;bottom:-35px;font-size:140px;font-weight:900;color:rgba(255,255,255,.025);letter-spacing:.02em}
.kicker{font-size:12px;color:var(--gold);letter-spacing:.28em;font-weight:800}
h1{font-size:clamp(42px,6vw,82px);line-height:.92;margin:22px 0 18px;letter-spacing:-.045em}
.hero-copy{max-width:620px;color:#b4c1d2;font-size:15px;line-height:1.9}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.hero-side{padding:28px;display:flex;flex-direction:column}
.section-title{font-size:13px;color:#cbd4e2;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px}
.role-grid{display:grid;gap:12px}
.role-card{padding:18px;border:1px solid var(--line);background:#0a1424;display:flex;justify-content:space-between;align-items:center;transition:.18s;cursor:pointer}
.role-card:hover{border-color:rgba(217,182,111,.4);transform:translateY(-1px)}
.role-card strong{display:block}
.role-card span{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.arrow{color:var(--gold);font-size:20px}
.button,button{appearance:none;border:0;cursor:pointer;font:inherit}
.primary,.secondary,.ghost,.team-button{border-radius:10px;padding:13px 18px;font-weight:800;transition:.18s}
.primary{background:linear-gradient(135deg,#e1c07e,#b78b42);color:#12100b;box-shadow:0 10px 28px rgba(183,139,66,.22)}
.primary:hover{transform:translateY(-1px);filter:brightness(1.05)}
.secondary{background:#16253b;color:#f3f6fb;border:1px solid rgba(102,168,255,.18)}
.secondary:hover{border-color:rgba(102,168,255,.45)}
.ghost{background:transparent;color:#c0cad8;border:1px solid var(--line)}
.ghost:hover{background:rgba(255,255,255,.04)}
.danger{color:#ff9399;border-color:rgba(228,82,93,.22)}
.small{padding:8px 11px;font-size:12px;border-radius:8px}
.disabled{opacity:.35;pointer-events:none}
.panel{padding:24px;border-radius:14px}
.panel + .panel{margin-top:18px}
.page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:4px 0 24px}
.page-head h2{font-size:32px;margin:0}
.page-head p{margin:6px 0 0;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;color:#9facc0;font-size:12px;margin-bottom:7px}
input,select{width:100%;background:#091322;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 13px;outline:none}
input:focus,select:focus{border-color:rgba(217,182,111,.5);box-shadow:0 0 0 3px rgba(217,182,111,.07)}
.people-list{display:grid;gap:8px;max-height:520px;overflow:auto;padding-right:4px}
.person-row{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);background:#091322;border-radius:10px}
.num{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#13233a;color:#8fa0b8;font-size:12px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;color:#a8b4c4}
.icon-btn:hover{background:rgba(255,255,255,.05)}
.team-card{position:relative;overflow:hidden;padding:24px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,#101d30,#0a1424)}
.team-card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--team,#d9b66f)}
.team-tag{font-size:10px;letter-spacing:.2em;color:var(--muted)}
.team-name{font-size:26px;font-weight:900;margin:8px 0 4px}
.team-leader{color:#b8c4d4;font-size:13px}
.team-count{margin-top:18px;font-size:12px;color:var(--muted)}
.team-roster{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#0a1424;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px}
.draft-layout{display:grid;grid-template-columns:320px 1fr;gap:18px}
.sidebar{display:flex;flex-direction:column;gap:14px}
.status-box{padding:18px;border-radius:14px;border:1px solid var(--line);background:#0a1424}
.status-label{font-size:10px;letter-spacing:.16em;color:var(--muted)}
.status-value{font-size:24px;font-weight:900;margin-top:7px}
.candidate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.candidate{border:1px solid var(--line);background:#0a1424;border-radius:11px;padding:14px;text-align:left;color:var(--text);transition:.18s}
.candidate:hover{border-color:rgba(217,182,111,.42);transform:translateY(-1px)}
.candidate.selected{border-color:var(--gold);background:rgba(217,182,111,.08)}
.candidate.locked{opacity:.38;pointer-events:none}
.candidate .cand-no{font-size:10px;color:var(--muted)}
.candidate .cand-name{font-size:16px;font-weight:800;margin-top:7px}
.selection-bar{position:sticky;bottom:16px;margin-top:18px;padding:16px;border:1px solid rgba(217,182,111,.28);background:rgba(9,19,34,.94);backdrop-filter:blur(12px);border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.selection-bar strong{color:var(--gold2)}
.spectator-stage{min-height:610px;position:relative;overflow:hidden;border:1px solid var(--line);background:
 radial-gradient(circle at 50% 35%, rgba(217,182,111,.11), transparent 28%),
 linear-gradient(180deg,#0b1627,#060d18);box-shadow:var(--shadow)}
.stage-top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}
.live{font-size:11px;letter-spacing:.18em;color:#ff777f}
.stage-center{min-height:430px;display:grid;place-items:center;text-align:center;padding:36px}
.round-label{font-size:14px;letter-spacing:.28em;color:var(--gold);font-weight:800}
.stage-title{font-size:clamp(38px,7vw,88px);font-weight:950;line-height:1.05;margin:18px 0}
.stage-sub{color:#9fafc4;font-size:16px}
.reveal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(100%,1000px);margin:28px auto 0}
.reveal-card{padding:22px;border:1px solid var(--line);background:rgba(10,20,36,.74);min-height:130px;display:flex;flex-direction:column;justify-content:center}
.reveal-team{font-size:11px;color:var(--muted);letter-spacing:.16em}
.reveal-name{font-size:24px;font-weight:900;margin-top:10px}
.reveal-card.conflict{border-color:rgba(228,82,93,.55);box-shadow:0 0 30px rgba(228,82,93,.12)}
.reveal-card.winner{border-color:rgba(217,182,111,.75);box-shadow:0 0 42px rgba(217,182,111,.2);animation:pulseGold 1.4s ease-in-out infinite}
@keyframes pulseGold{50%{transform:translateY(-4px);box-shadow:0 0 62px rgba(217,182,111,.28)}}
.stage-footer{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.stage-team{padding:16px 20px;border-right:1px solid var(--line)}
.stage-team:last-child{border-right:0}
.stage-team strong{display:block}
.stage-team span{font-size:11px;color:var(--muted)}
.admin-actions{display:flex;gap:10px;flex-wrap:wrap}
.callout{padding:14px 16px;border-left:3px solid var(--gold);background:rgba(217,182,111,.06);color:#c7d1df;font-size:13px;line-height:1.7}
.log{max-height:300px;overflow:auto;display:grid;gap:8px}
.log-item{font-size:12px;color:#b3c0d0;padding:10px 12px;background:#091322;border:1px solid var(--line);border-radius:9px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:grid;place-items:center;padding:24px}
.modal{width:min(560px,100%);border:1px solid var(--line);background:#0b1627;box-shadow:0 28px 80px rgba(0,0,0,.55);padding:28px;border-radius:16px}
.modal h3{font-size:26px;margin:0 0 10px}
.modal p{color:var(--muted);line-height:1.8}
.lottery-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.lottery-card{height:118px;border:1px solid var(--line);background:#091322;color:var(--text);border-radius:12px;font-weight:900}
.lottery-card:hover{border-color:var(--gold)}
.toast{position:fixed;right:22px;bottom:22px;z-index:200;background:#111e32;border:1px solid var(--line);padding:14px 18px;border-radius:12px;box-shadow:var(--shadow);animation:toastIn .18s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}
.sep{height:1px;background:var(--line);margin:20px 0}
.muted{color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
@media(max-width:980px){
  .hero,.grid-2,.draft-layout{grid-template-columns:1fr}
  .grid-3,.candidate-grid,.reveal-grid{grid-template-columns:1fr 1fr}
  .hero-main{padding:38px}
}
@media(max-width:680px){
  .topbar{height:64px;padding:0 14px}
  .app{padding:22px 14px 70px}
  .brand-sub{display:none}
  .sync-badge{display:none}
  .hero-main{min-height:auto;padding:30px 22px}
  h1{font-size:48px}
  .grid-3,.candidate-grid,.reveal-grid,.form-row{grid-template-columns:1fr}
  .page-head{align-items:flex-start;flex-direction:column}
  .stage-footer{grid-template-columns:1fr}
  .stage-team{border-right:0;border-bottom:1px solid var(--line)}
  .stage-team:last-child{border-bottom:0}
  .selection-bar{align-items:stretch;flex-direction:column}
  .top-actions .small{font-size:10px;padding:7px 8px}
}


/* v0.5 envelope lottery */
.lottery-summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}.lottery-summary span{padding:7px 10px;border-radius:999px;border:1px solid #6e5627;background:#171207;color:var(--gold2);font-weight:800}.lottery-summary b{color:#9da9bd;font-size:.72rem}
.lottery-overlay{position:fixed;inset:0;z-index:110;display:none;place-items:center;overflow:auto;padding:20px}.lottery-overlay.show{display:grid}.lottery-backdrop{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(239,181,71,.14),transparent 28rem),linear-gradient(145deg,#02040a,#0a1020 58%,#211505);backdrop-filter:blur(6px)}
.lottery-stage{position:relative;width:min(1050px,96vw);min-height:min(720px,92vh);border:1px solid #866728;border-radius:24px;background:linear-gradient(155deg,rgba(16,24,42,.98),rgba(24,18,8,.98));box-shadow:0 30px 90px rgba(0,0,0,.65);padding:clamp(18px,4vw,42px);text-align:center;overflow:hidden}.lottery-stage:before,.lottery-stage:after{content:"";position:absolute;left:-10%;width:120%;height:2px;background:linear-gradient(90deg,transparent,#d7a440,transparent);opacity:.5}.lottery-stage:before{top:16%;transform:rotate(-3deg)}.lottery-stage:after{bottom:14%;transform:rotate(3deg)}
.lottery-topline{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px}.lottery-competition{position:relative;z-index:2;color:#ffce73;font-size:clamp(1rem,3vw,1.5rem);font-weight:900;letter-spacing:.15em;margin-top:35px}.lottery-target{position:relative;z-index:2;font-size:clamp(2.8rem,9vw,6.8rem);line-height:1.05;margin:10px 0 16px;text-shadow:0 12px 45px rgba(0,0,0,.65)}.lottery-status{position:relative;z-index:2;min-height:2em;color:#d8deea;font-size:clamp(1rem,2.3vw,1.35rem);font-weight:700}.lottery-board{position:relative;z-index:2;margin-top:26px}
.shuffle-deck{height:230px;display:grid;place-items:center;position:relative;margin-bottom:18px}.envelope{position:relative;width:min(260px,70vw);height:160px;border:0;border-radius:10px;background:linear-gradient(145deg,#f2e6c6,#d7c49b);color:#352811;box-shadow:0 18px 45px rgba(0,0,0,.38);display:grid;place-items:center;font-weight:1000;letter-spacing:.12em;overflow:hidden}.envelope:before,.envelope:after{content:"";position:absolute;inset:auto 0 0;height:70%;clip-path:polygon(0 100%,50% 20%,100% 100%);background:rgba(152,125,72,.16)}.envelope:after{inset:0 0 auto;height:65%;clip-path:polygon(0 0,50% 80%,100% 0);background:rgba(255,255,255,.28)}.envelope span,.envelope small{position:relative;z-index:2}.envelope.demo{position:absolute;transform:translateX(calc((var(--i) - 1) * 38px)) rotate(calc((var(--i) - 1) * 4deg))}.lottery-overlay.shuffling .envelope.demo:nth-child(1){animation:shuffleA .48s ease-in-out infinite alternate}.lottery-overlay.shuffling .envelope.demo:nth-child(2){animation:shuffleB .42s ease-in-out infinite alternate}.lottery-overlay.shuffling .envelope.demo:nth-child(3){animation:shuffleC .52s ease-in-out infinite alternate}.lottery-main-btn{font-size:1.08rem;padding:13px 22px}
.envelope-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:1080px;margin:0 auto}.envelope.pickable{width:100%;height:180px;transition:.18s}.envelope.pickable:hover{transform:translateY(-9px) scale(1.025);box-shadow:0 25px 60px rgba(239,181,71,.22)}.envelope.pickable small{display:block;font-weight:700;letter-spacing:0;margin-top:8px;opacity:.7}.envelope.taken{width:100%;height:180px;opacity:.24;filter:grayscale(1)}
.selection-ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px auto 0;max-width:1000px}.selection-ledger div{border:1px solid #35425c;border-radius:10px;padding:10px;background:#0d1527}.selection-ledger b,.selection-ledger span{display:block}.selection-ledger span{color:#9eabc0;font-size:.78rem;margin-top:3px}
.owned-envelopes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1080px;margin:0 auto}.owned-envelope{min-height:235px;border:1px solid #a58a51;border-radius:16px;background:linear-gradient(145deg,#efe1be,#cdb98c);color:#30240e;display:grid;align-content:center;gap:10px;padding:18px;box-shadow:0 18px 45px rgba(0,0,0,.34);position:relative;overflow:hidden}.owned-envelope:before{content:"";position:absolute;left:0;right:0;top:0;height:43%;background:rgba(255,255,255,.28);clip-path:polygon(0 0,50% 100%,100% 0)}.owned-envelope .owner,.owned-envelope .paper,.owned-envelope small{position:relative;z-index:2}.owned-envelope .owner{font-size:1rem;font-weight:900}.owned-envelope .paper{font-size:clamp(1.25rem,3vw,2rem);font-weight:1000}.owned-envelope small{opacity:.68}.owned-envelope.lose{background:linear-gradient(145deg,#d6d9dd,#9ca3ad);color:#30343a;filter:saturate(.55)}.owned-envelope.win{background:linear-gradient(145deg,#fff1a5,#d99a24);color:#3a2604;border-color:#ffd45e;box-shadow:0 0 0 3px rgba(255,210,76,.2),0 18px 65px rgba(239,181,71,.42);animation:winnerPulse .8s ease infinite alternate}.lottery-overlay.drumroll .lottery-stage{animation:stageTension .11s linear infinite alternate}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-20px;width:10px;height:18px;background:hsl(calc(var(--spin) / 4),80%,60%);animation:confettiFall 2.6s var(--delay) ease-in forwards}.confetti i:nth-child(3n){border-radius:50%}.confetti i:nth-child(4n){width:16px;height:8px}
@keyframes shuffleA{from{transform:translate(-80px,-8px) rotate(-9deg)}to{transform:translate(85px,12px) rotate(9deg)}}@keyframes shuffleB{from{transform:translate(65px,10px) rotate(7deg)}to{transform:translate(-72px,-12px) rotate(-7deg)}}@keyframes shuffleC{from{transform:translate(-30px,16px) rotate(-5deg)}to{transform:translate(35px,-16px) rotate(5deg)}}@keyframes winnerPulse{from{transform:scale(1)}to{transform:scale(1.035)}}@keyframes stageTension{from{transform:translateX(-1px)}to{transform:translateX(1px)}}@keyframes confettiFall{0%{transform:translate(0,-30px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(var(--drift),105vh) rotate(var(--spin));opacity:.9}}
@media(max-width:760px){.lottery-stage{min-height:94vh}.lottery-topline{align-items:flex-start;flex-direction:column}.envelope-grid,.owned-envelopes,.selection-ledger{grid-template-columns:1fr}.shuffle-deck{height:190px}.envelope.pickable,.envelope.taken{height:135px}.owned-envelope{min-height:155px}}


/* Ver.2.4 Admin PIN lock */
.pin-overlay{
  position:fixed;inset:0;z-index:300;display:none;place-items:center;padding:22px;
  background:rgba(3,8,16,.82);backdrop-filter:blur(12px)
}
.pin-overlay.show{display:grid}
.pin-dialog{
  width:min(430px,100%);border:1px solid rgba(217,182,111,.28);border-radius:18px;
  padding:28px;background:linear-gradient(180deg,#101b2d,#091321);box-shadow:0 30px 100px rgba(0,0,0,.55)
}
.pin-lock-icon{
  width:58px;height:58px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;
  font-size:25px;background:rgba(217,182,111,.09);border:1px solid rgba(217,182,111,.28)
}
.pin-dialog h3{text-align:center;margin:0 0 8px;font-size:25px}
.pin-dialog p{text-align:center;color:var(--muted);line-height:1.7;font-size:13px}
.pin-input{
  text-align:center;font-size:26px;letter-spacing:.35em;font-weight:900;margin-top:14px
}
.pin-error{min-height:20px;margin-top:9px;text-align:center;color:#ff8d95;font-size:12px}
.pin-actions{display:flex;gap:10px;margin-top:12px}
.pin-actions button{flex:1}


/* Ver.3.0 all-in prototype */
.event-name-input{font-size:20px;font-weight:900;letter-spacing:.03em}
.resume-banner{margin-bottom:18px;padding:16px 18px;border:1px solid rgba(83,194,139,.3);border-radius:13px;background:rgba(83,194,139,.07);display:flex;justify-content:space-between;gap:16px;align-items:center}
.resume-banner strong{display:block}.resume-banner span{font-size:12px;color:var(--muted)}
.draft-board{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#091322}
.draft-board th,.draft-board td{padding:12px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.draft-board th:last-child,.draft-board td:last-child{border-right:0}.draft-board tr:last-child td{border-bottom:0}
.draft-board th{font-size:11px;letter-spacing:.12em;color:var(--muted);background:#0d192a}
.board-name{font-weight:900}.board-badge{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;font-size:9px;letter-spacing:.08em;border:1px solid var(--line);color:var(--muted)}
.board-badge.win{color:#f0cf84;border-color:rgba(217,182,111,.48);background:rgba(217,182,111,.08)}
.board-badge.lose{color:#ff969d;border-color:rgba(228,82,93,.35)}
.board-hidden{color:#5e6c80;font-weight:800;letter-spacing:.18em}
.live-reveal-card{position:relative;overflow:hidden;transition:.45s;min-height:150px}

/* Ver.4.0 Group Draft */
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.group-setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.group-setup-card{
  position:relative;padding:16px;border:1px solid var(--ny-line);border-radius:16px;
  background:linear-gradient(145deg,#fffdf8,#f7ead3)
}
.group-setup-card .group-count{font-size:11px;color:var(--muted);margin-top:7px}
.group-members-preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.group-members-preview span{
  padding:5px 8px;border-radius:999px;background:#fff5df;border:1px solid rgba(85,62,29,.12);
  font-size:11px;color:#574b3b
}
.member-group-row{
  display:grid;grid-template-columns:38px minmax(140px,1fr) minmax(150px,.8fr) auto;
  align-items:center;gap:9px;padding:9px;border:1px solid var(--ny-line);border-radius:12px;background:#fffdf8
}
.member-group-row.is-participant{background:#f0eee8;opacity:.82}
.group-candidate{
  min-height:128px!important;display:flex;flex-direction:column;justify-content:space-between
}
.group-candidate .group-member-list{
  display:flex;gap:5px;flex-wrap:wrap;margin-top:10px
}
.group-candidate .group-member-list span{
  font-size:10px;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.72);
  border:1px solid rgba(64,45,20,.10)
}
.group-win-card{
  margin-top:10px;padding:11px;border-radius:12px;background:#fff4d5;border:1px solid rgba(217,155,43,.20)
}
.group-win-card strong{display:block;color:#9a6210}
.group-win-card span{display:block;font-size:11px;color:#655b4d;margin-top:4px;line-height:1.5}
.rebid-banner{
  padding:16px 18px;margin-bottom:18px;border-radius:16px;
  background:linear-gradient(135deg,#2a302c,#1e2421);color:#fff;border:1px solid rgba(255,202,98,.28)
}
.rebid-banner strong{color:#ffd16c}
.rebid-banner span{display:block;margin-top:5px;font-size:12px;color:#e5dfd1}
.attempt-list{display:grid;gap:9px}
.attempt-card{padding:12px;border:1px solid var(--ny-line);border-radius:12px;background:#fffdf8}
.attempt-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.attempt-picks{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.attempt-picks span{font-size:11px;padding:5px 8px;border-radius:999px;background:#f7ecd8}
.group-board-cell .board-name{font-size:15px}
.group-board-cell .group-member-mini{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
.setup-warning{margin-top:10px;font-size:11px;color:#a25b27}
@media(max-width:1180px){.grid-4,.complete-rosters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:780px){
  .group-setup-grid{grid-template-columns:1fr}
  .member-group-row{grid-template-columns:34px 1fr}
  .member-group-row select,.member-group-row .icon-btn{grid-column:2}
}
@media(max-width:680px){.grid-4,.complete-rosters{grid-template-columns:1fr}}


/* =========================================================
   Ver.5.0 ONLINE / CHAT

.online-status{

.chat-msg.system .chat-meta{color:#d9cbaa}
.chat-role{font-weight:900;color:#a36712}
.chat-msg.system .chat-role{color:#ffd16c}
.chat-body{font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.chat-compose{padding:12px;background:#fffaf0;border-top:1px solid var(--ny-line);display:grid;grid-template-columns:1fr auto;gap:8px}
.chat-compose input{min-width:0}
.online-presence{font-size:10px;color:#7c7469;margin-top:3px}
.join-name{

}
.join-name label{font-weight:800}
@media(max-width:680px){
  .online-link-row{grid-template-columns:1fr}
  .chat-panel{left:10px;right:10px;bottom:74px;width:auto;height:min(66vh,560px)}

}

  <main id="app" class="app"></main>

    <div class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="online-config.js"></script>
  <script>

const STORAGE_KEY='nyouncerGroupDraftV50Prototype';
const HISTORY_KEY='nyouncerGroupDraftV50History';
const ADMIN_UNLOCK_KEY='nyouncerGroupDraftAdminUnlockedV50';
const bc='BroadcastChannel' in window ? new BroadcastChannel('nyouncer-group-draft-v50') : null;

const defaultNames=Array.from({length:30},(_,i)=>`団員${String(i+1).padStart(2,'0')}`);

function initialGroups(){
  const names=['Aグループ','Bグループ','Cグループ','Dグループ','Eグループ','Fグループ','Gグループ','Hグループ'];
  return names.map((name,i)=>({
    id:'g'+(i+1),
    name,
    memberIds:Array.from({length:3},(_,j)=>'p'+(5+i*3+j)).filter(id=>Number(id.slice(1))<=28),
    acquiredBy:null
  }));
}
function initialState(){
  return {
    version:4,
    setupComplete:false,
    eventName:'ちゃおちゅーる 団員グループドラフト会議',
    people:defaultNames.map((name,i)=>({id:'p'+(i+1),name})),
    teams:[
      {id:'A',name:'抽選参加者1',leaderId:'p1',members:[],groupsWon:[]},
      {id:'B',name:'抽選参加者2',leaderId:'p2',members:[],groupsWon:[]},
      {id:'C',name:'抽選参加者3',leaderId:'p3',members:[],groupsWon:[]},
      {id:'D',name:'抽選参加者4',leaderId:'p4',members:[],groupsWon:[]}
    ],
    groups:initialGroups(),
    round:1,
    roundAttempt:1,
    currentRoundAssignments:{},
    currentAttemptHistory:[],
    phase:'waiting',
    phaseBeforePause:null,
    openingUntil:null,
    selections:{A:null,B:null,C:null,D:null},
    pendingConflict:null,
    lastReveal:null,
    revealIndex:0,
    board:[],
    logs:[],
    chatMessages:[],
    started:false,
    finishedAt:null,
    adminPinHash:null,
    voice:{
      enabled:false,
      engineUrl:'http://127.0.0.1:10101',
      speakerId:null,
      speakerLabel:'',
      connected:false,
      announcerPreset:true,
      speedScale:0.88,
      intonationScale:0.78,
      tempoDynamicsScale:0.72,
      pitchScale:0.0,
      volumeScale:1.08,
      prePhonemeLength:0.12,
      postPhonemeLength:0.18
    }
  };
}
function normalizeState(s){
  const d=initialState();
  s={...d,...(s||{})};
  s.people=Array.isArray(s.people)?s.people:d.people;
  s.teams=Array.isArray(s.teams)&&s.teams.length>=2&&s.teams.length<=4?s.teams:d.teams;
  s.teams=s.teams.map((t,i)=>({...d.teams[i],...t,members:Array.isArray(t.members)?t.members:[],groupsWon:Array.isArray(t.groupsWon)?t.groupsWon:[]}));
  s.groups=Array.isArray(s.groups)&&s.groups.length?s.groups:d.groups;
  s.groups=s.groups.map((g,i)=>({id:g.id||`g${i+1}`,name:g.name||`グループ${i+1}`,memberIds:Array.isArray(g.memberIds)?g.memberIds:[],acquiredBy:g.acquiredBy||null}));
  s.selections={A:null,B:null,C:null,D:null,...(s.selections||{})};
  s.currentRoundAssignments={...(s.currentRoundAssignments||{})};
  s.currentAttemptHistory=Array.isArray(s.currentAttemptHistory)?s.currentAttemptHistory:[];
  s.board=Array.isArray(s.board)?s.board:[];
  s.logs=Array.isArray(s.logs)?s.logs:[];
  s.chatMessages=Array.isArray(s.chatMessages)?s.chatMessages:[];
  s.voice={...d.voice,...(s.voice||{})};
  s.roundAttempt=Number(s.roundAttempt)||1;
  if(s.phase==='opening' && s.openingUntil && Date.now()>s.openingUntil){s.phase='selecting';s.openingUntil=null;}
  return s;
}
function loadState(){try{return normalizeState(JSON.parse(localStorage.getItem(STORAGE_KEY))||initialState())}catch(e){return initialState()}}
let state=loadState();
let view=parseView();
let tempSelected=null;
let revealRunner=false;
let lotteryAnimating=false;
let lotteryAudioCtx=null;
if(view.screen==='admin'&&!isAdminUnlocked()){view={screen:'home',team:null};const u=new URL(location.href);u.searchParams.set('screen','home');u.searchParams.delete('team');history.replaceState({},'',u)}

function saveState(source='local'){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  if(source==='local'&&bc)bc.postMessage({type:'sync'});
  if(source==='local'&&isOnlineHost())onlineScheduleSnapshots();
}
function checkpoint(reason){
  try{
    const arr=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
    arr.push({reason,at:Date.now(),state:JSON.parse(JSON.stringify(state))});
    localStorage.setItem(HISTORY_KEY,JSON.stringify(arr.slice(-30)));
  }catch(e){}
}
function undoCheckpoint(){
  try{
    const arr=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
    if(!arr.length)return toast('戻せる操作がありません');
    const snap=arr.pop();localStorage.setItem(HISTORY_KEY,JSON.stringify(arr));
    state=normalizeState(snap.state);saveState();render();toast(`「${snap.reason}」の直前まで戻しました`);
  }catch(e){toast('復元に失敗しました')}
}
function clearHistory(){localStorage.removeItem(HISTORY_KEY)}
function syncFromStorage(){if(isOnlineRemote())return;state=loadState();render();refreshLotteryOverlayIfNeeded()}
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY)syncFromStorage()});
if(bc)bc.onmessage=()=>syncFromStorage();

function parseView(){const p=new URLSearchParams(location.search);return{screen:p.get('screen')||'home',team:p.get('team')||null}}
function go(screen,teamId=null){
  if(isOnlineSpectator()){screen='spectator';teamId=null}
  if(isOnlineParticipant()){screen='leader';teamId=onlineSession.team}
  const u=new URL(location.href);u.searchParams.set('screen',screen);if(teamId)u.searchParams.set('team',teamId);else u.searchParams.delete('team');
  history.pushState({},'',u);view={screen,team:teamId};render()
}
window.addEventListener('popstate',()=>{view=parseView();render()});

function person(id){return state.people.find(p=>p.id===id)}
function team(id){return state.teams.find(t=>t.id===id)}
function group(id){return state.groups.find(g=>g.id===id)}
function participantIds(){return new Set(state.teams.map(t=>t.leaderId).filter(Boolean))}
function groupOfPerson(pid){return state.groups.find(g=>g.memberIds.includes(pid))||null}
function availableGroups(){return state.groups.filter(g=>!g.acquiredBy)}
function activeTeamIds(){return state.teams.map(t=>t.id).filter(id=>!state.currentRoundAssignments[id])}
function allSelected(){const active=activeTeamIds();return active.length>0&&active.every(id=>state.selections[id])}
function groupMembersLabel(gid){const g=group(gid);return g?g.memberIds.map(id=>person(id)?.name||id).join('・'):''}
function awardGroup(tid,gid,mode='direct'){
  const t=team(tid),g=group(gid);
  if(!t||!g||g.acquiredBy)return false;
  g.acquiredBy=tid;
  if(!t.groupsWon.includes(gid))t.groupsWon.push(gid);
  g.memberIds.forEach(pid=>{if(!t.members.includes(pid))t.members.push(pid)});
  state.currentRoundAssignments[tid]=gid;
  const attempt=state.currentAttemptHistory[state.currentAttemptHistory.length-1];
  if(attempt?.results?.[tid])Object.assign(attempt.results[tid],{mode,acquired:true});
  return true;
}
function groupCountWarning(){
  const count=state.teams.length;
  if(state.groups.length<count)return`グループは最低${count}つ必要です。`;
  if(state.groups.some(g=>!g.memberIds.length))return'空のグループがあります。各グループに1名以上設定してください。';
  if(state.groups.length%count!==0)return`現在${state.groups.length}グループです。${count}の倍数ではないため、最終的に${state.groups.length%count}グループ余る可能性があります。`;
  return`${count}人制ドラフトとして問題なく開始できます。`;
}
function phaseLabel(p){return({waiting:'待機',opening:'開幕演出',selecting:state.roundAttempt>1?'再指名':'選択中',reveal:'指名発表',lottery:'抽選',paused:'一時停止',complete:'終了'})[p]||p}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function log(msg){state.logs.unshift({at:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),msg});state.logs=state.logs.slice(0,120);onlineMaybeSystemLog(msg)}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}


/* =========================================================
   Ver.5.0 Online Realtime transport
   Host-authoritative. Public channel never receives hidden picks.
   ========================================================= */
const ONLINE_CFG=window.NYOUNCER_ONLINE_CONFIG||{};
const ONLINE_HOST_META_KEY='nyouncerV50OnlineHostMeta';
const onlineParams=new URLSearchParams(location.search);
let onlineSession={
  enabled:onlineParams.get('online')==='1',
  role:onlineParams.get('role')||null,
  room:(onlineParams.get('room')||'').toUpperCase(),
  team:onlineParams.get('team')||null,
  token:onlineParams.get('token')||null,
  displayName:'',
  connected:false,
  presenceCount:0,
  error:'',
  gotState:false
};
let onlineClient=null;
let onlinePublicChannel=null;
let onlineTeamChannel=null;
let onlineHostTeamChannels={};
let onlineBroadcastTimer=null;
let onlineUnread=0;
let onlineChatOpen=false;
let onlineJoinWatchdog=null;

function reportOnlineSubscriptionFailure(status,err){
  if(status==='SUBSCRIBED'){
    onlineSession.connected=true;
    onlineSession.error='';
    if(onlineJoinWatchdog){clearTimeout(onlineJoinWatchdog);onlineJoinWatchdog=null;}
    renderOnlineChrome();
    return;
  }
  if(!['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status))return;
  console.error('[NYOUNCER Realtime]',status,err||'(no details)');
  onlineSession.connected=false;
  const info=String(err?.message||err?.cause?.message||'').slice(0,240);
  const label=({CHANNEL_ERROR:'接続エラー',TIMED_OUT:'接続タイムアウト',CLOSED:'接続が閉じられました'})[status];
  onlineSession.error=`Supabase Realtime: ${label}${info?' ／ '+info:''}。プロジェクトの稼働状態とRealtime設定、ネットワークを確認してください。`;
  renderOnlineChrome();
}

function onlineConfigReady(){
  return !!(ONLINE_CFG.supabaseUrl&&ONLINE_CFG.supabaseKey&&
    !String(ONLINE_CFG.supabaseUrl).includes('YOUR_')&&!String(ONLINE_CFG.supabaseKey).includes('YOUR_'));
}
function isOnlineMode(){return !!onlineSession.enabled}
function isOnlineHost(){return isOnlineMode()&&onlineSession.role==='host'}
function isOnlineParticipant(){return isOnlineMode()&&onlineSession.role==='participant'}
function isOnlineSpectator(){return isOnlineMode()&&onlineSession.role==='spectator'}
function isOnlineRemote(){return isOnlineParticipant()||isOnlineSpectator()}
function onlineRandom(chars=14){
  const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a=new Uint32Array(chars);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<chars;i++)a[i]=Math.floor(Math.random()*1e9)}
  return [...a].map(v=>alphabet[v%alphabet.length]).join('');
}
function onlineHostMeta(){
  try{return JSON.parse(localStorage.getItem(ONLINE_HOST_META_KEY)||'null')}catch(e){return null}
}
function createOnlineHostMeta(){
  const meta={roomCode:onlineRandom(7),tokens:{A:onlineRandom(18),B:onlineRandom(18),C:onlineRandom(18),D:onlineRandom(18)},createdAt:Date.now()};
  localStorage.setItem(ONLINE_HOST_META_KEY,JSON.stringify(meta));return meta
}
function onlineBaseUrl(){
  if(ONLINE_CFG.publicBaseUrl){
    try{return new URL(ONLINE_CFG.publicBaseUrl).toString()}catch(e){}
  }
  const u=new URL(location.href);u.search='';u.hash='';return u.toString()
}
function onlineSpectatorUrl(meta=onlineHostMeta()){
  if(!meta)return'';const u=new URL(onlineBaseUrl());u.searchParams.set('online','1');u.searchParams.set('room',meta.roomCode);u.searchParams.set('role','spectator');return u.toString()
}
function onlineParticipantUrl(tid,meta=onlineHostMeta()){
  if(!meta)return'';const u=new URL(onlineBaseUrl());u.searchParams.set('online','1');u.searchParams.set('room',meta.roomCode);u.searchParams.set('role','participant');u.searchParams.set('team',tid);u.searchParams.set('token',meta.tokens[tid]);return u.toString()
}
function onlinePublicTopic(){return `nyouncer:${onlineSession.room}:public`}
function onlineTeamTopic(tid,token){return `nyouncer:${onlineSession.room}:team:${tid}:${token}`}

function publicSnapshot(){
  const s=JSON.parse(JSON.stringify(state));
  delete s.adminPinHash;
  s.voice={enabled:false,connected:false};
  s.logs=[];
  s.currentAttemptHistory=[];
  const visible=Object.fromEntries(state.teams.map(t=>[t.id,null]));
  if(s.phase==='reveal'&&s.lastReveal){
    const ids=s.lastReveal.activeTeamIds||[];
    ids.forEach((tid,i)=>{if(i<s.revealIndex)visible[tid]=s.selections[tid]});
    s.lastReveal.selections={...visible};
    const counts={};Object.values(visible).filter(Boolean).forEach(gid=>counts[gid]=(counts[gid]||0)+1);
    s.lastReveal.conflicts=Object.entries(counts).filter(([,n])=>n>1).map(([gid])=>gid);
  }else if(s.phase==='lottery'){
    // All picks have already been revealed before lottery begins.

}

  if(isOnlineParticipant()&&(!onlineSession.team||!onlineSession.token)){onlineSession.error='指名席リンクが不完全です。主催者から専用URLを受け取ってください。';renderOnlineChrome();return}

    .on('broadcast',{event:'sync_request'},()=>{if(isOnlineHost())onlineBroadcastSnapshots()})
    .on('broadcast',{event:'chat_post'},({payload})=>{if(isOnlineHost())hostAcceptChat(payload)})
    .on('presence',{event:'sync'},()=>updatePresenceCount())
    .subscribe(async (status,err)=>{
      reportOnlineSubscriptionFailure(status,err);
      if(status==='SUBSCRIBED'){
        try{await onlinePublicChannel.track(onlinePresencePayload())}catch(e){}
        if(isOnlineSpectator()){
          await onlinePublicChannel.send({type:'broadcast',event:'sync_request',payload:{at:Date.now()}});
          [1200,3200,6500].forEach(ms=>setTimeout(()=>{if(!onlineSession.gotState)onlinePublicChannel?.send({type:'broadcast',event:'sync_request',payload:{at:Date.now()}})},ms));
        }

  // 接続エラーが届かない場合も、無期限に「接続中」と表示し続けない。

  },18000);

  if(isOnlineHost()){
    const meta=onlineHostMeta();
    for(const t of initialState().teams){
      const ch=onlineClient.channel(onlineTeamTopic(t.id,meta.tokens[t.id]),{config:{broadcast:{self:false}}})
        .on('broadcast',{event:'team_command'},({payload})=>handleOnlineTeamCommand(t.id,payload))
        .on('broadcast',{event:'team_sync_request'},()=>{const c=onlineHostTeamChannels[t.id];if(c)c.send({type:'broadcast',event:'state_team',payload:{state:teamSnapshot(t.id),at:Date.now()}})})
        .subscribe();
      onlineHostTeamChannels[t.id]=ch;
    }
  }else if(isOnlineParticipant()){
    onlineTeamChannel=onlineClient.channel(onlineTeamTopic(onlineSession.team,onlineSession.token),{config:{broadcast:{self:false}}})
      .on('broadcast',{event:'state_team'},({payload})=>applyOnlineSnapshot(payload.state))
      .subscribe(async status=>{
        if(status==='SUBSCRIBED'){
          await onlineTeamChannel.send({type:'broadcast',event:'team_sync_request',payload:{at:Date.now()}});
          [1200,3200,6500].forEach(ms=>setTimeout(()=>{if(!onlineSession.gotState)onlineTeamChannel?.send({type:'broadcast',event:'team_sync_request',payload:{at:Date.now()}})},ms));
        }
      });
  }
  if(isOnlineParticipant())view={screen:'leader',team:onlineSession.team};
  if(isOnlineSpectator())view={screen:'spectator',team:null};
}

let aivisSpeakersCache=[];
let aivisQueue=Promise.resolve();
let aivisAudioCtx=null;

function voiceSettings(){return state.voice||initialState().voice}
function cleanEngineUrl(url){return String(url||'http://127.0.0.1:10101').trim().replace(/\/+$/,'')}
function setVoiceStatus(kind,msg){
  const el=document.getElementById('aivisStatus');

function ensureAivisAudio(){
  try{
    aivisAudioCtx ||= new(window.AudioContext||window.webkitAudioContext)();
    if(aivisAudioCtx.state==='suspended')aivisAudioCtx.resume();
  }catch(e){}
}
async function aivisFetch(url,opts={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),7000);
  try{return await fetch(url,{...opts,signal:controller.signal})}
  finally{clearTimeout(timer)}
}
function flattenAivisSpeakers(speakers){
  const rows=[];
  (speakers||[]).forEach(sp=>{
    (sp.styles||[]).forEach(st=>{
      if(st.type && !['talk',''].includes(st.type))return;
      rows.push({
        id:Number(st.id),
        label:`${sp.name} / ${st.name||'ノーマル'}`,
        speakerName:sp.name,
        styleName:st.name||'ノーマル'
      });
    });
  });
  return rows;
}

function findAidaAnnouncerStyle(rows){
  const aida=rows.filter(r=>String(r.speakerName||'').replace(/\s/g,'').includes('阿井田茂'));
  if(!aida.length)return null;
  const priority=['Heavy','Mid','Calm','ノーマル','Normal'];
  for(const name of priority){
    const hit=aida.find(r=>String(r.styleName||'').toLowerCase()===name.toLowerCase());
    if(hit)return hit;
  }
  return aida[0];
}
function applyAidaAnnouncerPreset({selectVoice=true,notify=false}={}){
  const rows=flattenAivisSpeakers(aivisSpeakersCache);
  const aida=findAidaAnnouncerStyle(rows);
  state.voice={
    ...voiceSettings(),
    announcerPreset:true,
    speedScale:0.88,
    intonationScale:0.78,
    tempoDynamicsScale:0.72,
    pitchScale:0.0,
    volumeScale:1.08,
    prePhonemeLength:0.12,
    postPhonemeLength:0.18
  };
  if(selectVoice&&aida){
    state.voice.speakerId=aida.id;
    state.voice.speakerLabel=aida.label;
  }
  saveState();
  fillAivisVoiceSelect();
  syncVoiceParamInputs();
  if(notify){
    toast(aida?'阿井田 茂 / Heavy系を司会プリセットに設定しました':'阿井田 茂が見つかりません。モデルをAivisSpeechへ追加してください');
  }
  return aida;
}
function syncVoiceParamInputs(){
  const v=voiceSettings();
  const ids={
    voiceSpeed:'speedScale',voiceEmotion:'intonationScale',voiceTempo:'tempoDynamicsScale',
    voicePitch:'pitchScale',voiceVolume:'volumeScale'
  };
  Object.entries(ids).forEach(([id,key])=>{
    const el=document.getElementById(id);
    if(el)el.value=v[key];
  });
}
function fillAivisVoiceSelect(){
  const sel=document.getElementById('aivisVoiceSelect');
  if(!sel)return;
  const rows=flattenAivisSpeakers(aivisSpeakersCache);
  const current=Number(voiceSettings().speakerId);
  sel.innerHTML=rows.length
    ? rows.map(r=>`<option value="${r.id}" ${r.id===current?'selected':''}>${esc(r.label)}</option>`).join('')
    : '<option value="">接続テストで話者を読み込んでください</option>';
}
async function connectAivis({quiet=false}={}){
  const input=document.getElementById('aivisEngineUrl');
  const base=cleanEngineUrl(input?.value||voiceSettings().engineUrl);
  if(input)input.value=base;
  setVoiceStatus('busy','AivisSpeech Engine に接続しています…');
  try{
    const [verRes,spRes]=await Promise.all([
      aivisFetch(base+'/version'),
      aivisFetch(base+'/speakers')
    ]);
    if(!verRes.ok)throw new Error('version '+verRes.status);
    if(!spRes.ok)throw new Error('speakers '+spRes.status);
    const version=await verRes.text();
    const speakers=await spRes.json();
    aivisSpeakersCache=speakers;
    state.voice={...voiceSettings(),engineUrl:base,connected:true};
    fillAivisVoiceSelect();
    const rows=flattenAivisSpeakers(speakers);
    const aida=findAidaAnnouncerStyle(rows);
    const currentIsAida=String(state.voice.speakerLabel||'').replace(/\s/g,'').includes('阿井田茂');
    if(aida && (!state.voice.speakerId || voiceSettings().announcerPreset || !currentIsAida)){
      state.voice.speakerId=aida.id;
      state.voice.speakerLabel=aida.label;
      state.voice.announcerPreset=true;
      fillAivisVoiceSelect();
    }else if(!state.voice.speakerId&&rows[0]){
      state.voice.speakerId=rows[0].id;
      state.voice.speakerLabel=rows[0].label;
      fillAivisVoiceSelect();
    }
    saveState();
    setVoiceStatus('ok',`接続成功：AivisSpeech Engine ${String(version).replace(/"/g,'').trim()} ／ ${rows.length}スタイル`);
    if(!quiet)toast('AivisSpeech に接続しました');
    return true;
  }catch(e){
    state.voice={...voiceSettings(),engineUrl:base,connected:false};
    saveState();
    setVoiceStatus('bad','接続できません。AivisSpeechを起動し、ブラウザのローカルネットワークアクセスも確認してください。');

async function speakAivisText(text,{force=false,poseKey='speaking'}={}){
  const v=voiceSettings();
  if(!text||(!force&&!v.enabled)||v.speakerId===null||v.speakerId===undefined)return false;
  const base=cleanEngineUrl(v.engineUrl);
  const speaker=Number(v.speakerId);
  try{
    ensureAivisAudio();
    const qRes=await aivisFetch(`${base}/audio_query?text=${encodeURIComponent(text)}&speaker=${speaker}`,{method:'POST'});
    if(!qRes.ok)throw new Error('audio_query '+qRes.status);
    const query=await qRes.json();
    const vv=voiceSettings();
    if(vv.announcerPreset){
      if('speedScale' in query) query.speedScale=Number(vv.speedScale??0.88);
      if('intonationScale' in query) query.intonationScale=Number(vv.intonationScale??0.78);
      if('tempoDynamicsScale' in query) query.tempoDynamicsScale=Number(vv.tempoDynamicsScale??0.72);
      if('pitchScale' in query) query.pitchScale=Number(vv.pitchScale??0.0);
      if('volumeScale' in query) query.volumeScale=Number(vv.volumeScale??1.08);
      if('prePhonemeLength' in query) query.prePhonemeLength=Number(vv.prePhonemeLength??0.12);
      if('postPhonemeLength' in query) query.postPhonemeLength=Number(vv.postPhonemeLength??0.18);
    }
    const sRes=await aivisFetch(`${base}/synthesis?speaker=${speaker}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(query)
    });
    if(!sRes.ok)throw new Error('synthesis '+sRes.status);
    const array=await (await sRes.blob()).arrayBuffer();
    if(!aivisAudioCtx)throw new Error('AudioContext unavailable');
    const buffer=await aivisAudioCtx.decodeAudioData(array.slice(0));
    await new Promise((resolve,reject)=>{
      const src=aivisAudioCtx.createBufferSource();
      src.buffer=buffer;src.connect(aivisAudioCtx.destination);
      setNyouncerSpeech(text,true,poseKey);
      src.onended=()=>{setNyouncerSpeech('',false);resolve()};
      try{src.start()}catch(e){setNyouncerSpeech('',false);reject(e)}
    });
    return true;
  }catch(e){
    setNyouncerSpeech('',false);
    console.warn('[AivisSpeech synthesis]',e);
    state.voice={...voiceSettings(),connected:false};
    saveState();
    setVoiceStatus('bad','音声生成に失敗しました。接続・話者設定を確認してください。');
    return false;
  }
}
function announce(type,payload={}){
  const text=announcementText(type,payload);
  console.debug('[AivisSpeech]',type,text,payload);
  if(!text)return Promise.resolve(false);
  const poseKey=nyouncerPoseForAnnouncement(type);
  aivisQueue=aivisQueue.catch(()=>false).then(()=>speakAivisText(text,{poseKey}));
  return aivisQueue;
}

async function hashPin(pin){
  if(window.crypto?.subtle){const data=new TextEncoder().encode(pin);const hash=await crypto.subtle.digest('SHA-256',data);return[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  let h=2166136261;for(const ch of pin){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return'fallback-'+(h>>>0).toString(16)
}

let nyouncerSpeakingPose=null;

function nyouncerPoseForPhase(){
  if(state.phase==='paused')return 'confused';
  if(!state.started)return 'normal';
  if(state.phase==='opening')return 'hype';
  if(state.phase==='selecting')return 'clipboard';
  if(state.phase==='reveal')return 'speaking';
  if(state.phase==='lottery')return 'lottery';
  if(state.phase==='complete')return 'bow';
  return 'normal';
}
function nyouncerPoseForAnnouncement(type){
  switch(type){
    case 'opening':return 'hype';
    case 'round_start':return 'megaphone';
    case 'reveal_start':return 'mic';
    case 'pick_reveal':return 'speaking';
    case 'conflict':return 'conflict';
    case 'lottery_win':return 'celebrate';
    case 'complete':return 'bow';
    default:return 'speaking';
  }
}
function nyouncerPoseSrc(key){
  const pose=NYOUNCER_POSES[key]||NYOUNCER_POSES.normal;

}
function nyouncerCurrentPose(){
  return nyouncerSpeakingPose||nyouncerPoseForPhase();

function updateNyouncerPose(key){
  const poseKey=key||nyouncerCurrentPose();

    img.alt=`ニャウンサー・${pose.label}`;

function nyouncerPhaseLine(){
  if(state.phase==='paused') return 'ただいま一時停止中だにゃ。再開まで少し待っててにゃ！';

function draftBoardHTML(publicMode=false){

function leaderLotteryHTML(t){
  const c=ensureLotteryState(state.pendingConflict);
  if(!c||!c.teamIds.includes(t.id)){
    const won=state.currentRoundAssignments[t.id];
    return `<div class="panel">${won?`<div class="group-win-card"><strong>第${state.round}巡 獲得確定：${esc(group(won)?.name||won)}</strong><span>${esc(groupMembersLabel(won))}</span></div><div class="empty" style="margin-top:12px">他の参加者の抽選終了をお待ちください。</div>`:'<div class="empty">現在あなたが参加する抽選はありません。</div>'}</div>`;
  }
  const selected=c.assignments?.[t.id],opened=c.opened?.[t.id],currentTid=c.teamIds[c.selectionIndex],chosen=new Set(Object.values(c.assignments||{}));
  let body='';
  if(c.lotteryPhase==='ready')body=`<div class="empty">${c.shuffling?'封筒をシャッフル中……':'主催者が抽選開始を準備しています。'}</div>`;
  else if(c.openingTeam)body=`<div class="empty">${esc(team(c.openingTeam)?.name||'参加者')} が封筒を開封中……</div>`;
  else if(c.lotteryPhase==='select'&&currentTid===t.id)body=`<div class="callout">あなたの番です。好きな封筒を1枚選んでください。</div><div class="envelope-grid">${c.displayOrder.map((id,i)=>chosen.has(id)?`<div class="envelope taken"><span>選択済み</span></div>`:`<button class="envelope pickable rep-envelope" data-envelope-id="${id}"><span>封筒 ${i+1}</span><small>この封筒を引く</small></button>`).join('')}</div>`;
  else if(c.lotteryPhase==='select')body=`<div class="empty">${esc(team(currentTid)?.name||'他の参加者')} が封筒を選択中です。</div>`;
  else if(c.lotteryPhase==='open'&&selected&&!opened)body=`<div class="callout">封筒を確保しました。開封順は自由です。</div><div style="display:grid;place-items:center;margin-top:18px"><button class="owned-envelope rep-open" data-open-team="${t.id}"><span class="owner">${esc(t.name)}</span><span class="paper">封筒を開ける</span><small>タップして開封</small></button></div>`;
  else if(opened)body=`<div class="empty">${opened==='win'?'🎉 グループ獲得！':'はずれ。再指名になります。'}</div>`;
  else body='<div class="empty">抽選進行をお待ちください。</div>';
  return `<section class="rep-lottery"><div class="kicker">LOTTERY</div><h2 style="margin:8px 0">${esc(group(c.groupId)?.name||'')} 競合抽選</h2><div class="callout">${esc(groupMembersLabel(c.groupId))}</div>${body}</section>`
}

function spectatorLotteryCenter(){
  const c=ensureLotteryState(state.pendingConflict);if(!c)return'';let status='';
  if(c.shuffling)status='封筒をシャッフル中……';
  else if(c.openingTeam)status=`${esc(team(c.openingTeam)?.name||'')} が封筒を開封中……`;
  else if(c.lotteryPhase==='ready')status='抽選準備中';
  else if(c.lotteryPhase==='select')status=`${esc(team(c.teamIds[c.selectionIndex])?.name||'')} が封筒を選択中`;
  else status='各参加者が封筒を開封中';
  return `<div style="width:100%"><div class="round-label">第${state.round}巡 グループ抽選</div><div class="stage-title" style="font-size:50px">${esc(group(c.groupId)?.name||'')}</div><div class="stage-sub">${esc(groupMembersLabel(c.groupId))}<br>${c.teamIds.length}名競合 ／ ${status}</div><div class="spectator-lottery-status">${c.teamIds.map(id=>`<span class="chip">${esc(team(id)?.name||id)}　${c.opened?.[id]==='win'?'🎉 当たり':c.opened?.[id]==='lose'?'開封済み':c.assignments?.[id]?'封筒確保':'待機'}</span>`).join('')}</div></div>`
}
function spectatorView(){
  const r=state.lastReveal;let center='';
  if(state.phase==='paused')center=`<div class="paused-screen"><div class="round-label">EVENT PAUSED</div><div class="stage-title">一時停止</div><div class="stage-sub">主催者の再開をお待ちください</div></div>`;
  else if(!state.started)center=`<div><div class="round-label">${esc(state.eventName)}</div><div class="stage-title">開幕待機中</div><div class="stage-sub">まもなくグループドラフト会議が始まります</div></div>`;
  else if(state.phase==='opening')center=`<div><div class="round-label">GROUP DRAFT CONFERENCE</div><div class="opening-logo">DRAFT<br>START</div><div class="stage-sub">${esc(state.eventName)}</div></div>`;
  else if(state.phase==='selecting')center=`<div><div class="round-label">第${state.round}巡 ${state.roundAttempt>1?`再指名 ${state.roundAttempt-1}回目`:'選択希望グループ'}</div><div class="stage-title">${state.roundAttempt>1?'再指名受付中':'指名受付中'}</div><div class="stage-sub">残る${activeTeamIds().length}名が、未獲得グループから選択しています</div></div>`;
  else if(state.phase==='reveal'&&r)center=`<div style="width:100%"><div class="round-label">第${r.round}巡 ${r.attempt>1?`再指名 ${r.attempt-1}回目`:'選択希望グループ'}</div><div class="stage-title" style="font-size:42px">指名発表</div><div class="reveal-grid">${r.activeTeamIds.map((tid,i)=>{const shown=i<state.revealIndex,gid=r.selections[tid];return`<div class="reveal-card live-reveal-card ${shown?'just-revealed':'hidden-pick'} ${shown&&r.conflicts.includes(gid)?'conflict':''}"><div class="reveal-team">${esc(team(tid)?.name||tid)}</div><div class="reveal-name">${shown?esc(group(gid)?.name||'-'):'？？？'}</div>${shown?`<div class="group-member-mini">${esc(groupMembersLabel(gid))}</div>`:''}</div>`}).join('')}</div><div class="stage-sub" style="margin-top:24px">${state.revealIndex<r.activeTeamIds.length?'順次発表中……':r.conflicts.length?'競合発生 — 抽選へ':'獲得確定'}</div></div>`;
  else if(state.phase==='lottery')center=spectatorLotteryCenter();
  else if(state.phase==='complete')center=`<div style="width:100%"><div class="round-label">GROUP DRAFT COMPLETE</div><div class="stage-title" style="font-size:54px">ドラフト終了</div><div class="stage-sub">${esc(state.eventName)}</div><div class="complete-rosters">${state.teams.map((t,i)=>teamSummary(t,i)).join('')}</div><div class="result-actions"><button class="primary" id="downloadResultBtn">結果画像を保存</button></div></div>`;
  else center=`<div><div class="round-label">第${state.round}巡</div><div class="stage-title">次巡待機</div><div class="stage-sub">残り ${availableGroups().length}グループ</div></div>`;
  return `<div class="page-head"><div><div class="kicker">📺 NYOUNCER LIVE</div><h2>観戦席</h2><p>ニャウンサーがお届けするグループドラフトライブ中継</p></div><button class="ghost" data-go="home">ホーム</button></div><section class="spectator-stage ${state.phase==='reveal'?'broadcast-flash':''}"><div class="stage-top"><strong>🐾 ${esc(state.eventName)}</strong><span class="live">● LIVE</span></div><div class="stage-center">${center}</div>${nyouncerMascotHTML()}<div class="stage-footer">${state.teams.map(t=>`<div class="stage-team"><strong>${esc(t.name)}</strong><span>${esc(person(t.leaderId)?.name||'')} ／ ${t.groupsWon.length}グループ獲得</span></div>`).join('')}</div></section><section class="panel" style="margin-top:18px"><div class="section-title">🏆 LIVE DRAFT BOARD</div>${draftBoardHTML(true)}</section>`
}

function bind(){
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>el.dataset.go==='admin'?requestAdminAccess():go(el.dataset.go));

async function beginRound(){
  if(['opening','selecting','reveal','lottery','paused','complete'].includes(state.phase))return;
  if(availableGroups().length<state.teams.length){
    if(!state.started)return toast(`ドラフト開始には未獲得グループが${state.teams.length}つ以上必要です`);
    return finishDraft(false);
  }
  checkpoint(state.started?'次巡開始':'ドラフト開始');
  state.selections={A:null,B:null,C:null,D:null};
  state.currentRoundAssignments={};
  state.currentAttemptHistory=[];
  state.roundAttempt=1;
  state.pendingConflict=null;
  state.lastReveal=null;
  state.revealIndex=0;

  if(!state.started){
    state.started=true;state.phase='opening';state.openingUntil=Date.now()+2600;log(`${state.eventName} 開幕`);saveState();render();
    await Promise.all([sleep(2600),announce('opening',{eventName:state.eventName})]);
    state=loadState();
    if(state.phase==='opening'){
      state.phase='selecting';state.openingUntil=null;log(`第${state.round}巡 グループ指名受付開始`);saveState();render();
      announce('round_start',{round:state.round});
    }
  }else{
    state.phase='selecting';log(`第${state.round}巡 グループ指名受付開始`);saveState();render();
    announce('round_start',{round:state.round});
  }
}

async function revealSelections(){
  const active=activeTeamIds();
  if(!allSelected()||state.phase!=='selecting')return toast(`残る${active.length}名すべての指名が必要です`);
  checkpoint(state.roundAttempt>1?'再指名発表開始':'指名発表開始');

  const pickGroups={};
  active.forEach(tid=>{const gid=state.selections[tid];(pickGroups[gid]??=[]).push(tid)});
  const conflicts=Object.entries(pickGroups).filter(([,ids])=>ids.length>1).map(([gid])=>gid);

  state.lastReveal={
    round:state.round,
    attempt:state.roundAttempt,
    selections:{...state.selections},
    activeTeamIds:[...active],
    conflicts
  };
  state.revealIndex=0;
  state.phase='reveal';

  state.currentAttemptHistory.push({
    attempt:state.roundAttempt,
    activeTeamIds:[...active],
    picks:Object.fromEntries(active.map(id=>[id,state.selections[id]])),
    results:Object.fromEntries(active.map(id=>[id,{groupId:state.selections[id],mode:'pending',acquired:false}])),
    finalized:false
  });

  log(`第${state.round}巡 ${state.roundAttempt>1?`再指名${state.roundAttempt-1}回目`:'初回指名'} 発表開始`);
  saveState();render();resumeRevealSequence();
}

async function resumeRevealSequence(){
  if(revealRunner||state.phase!=='reveal')return;revealRunner=true;
  try{
    await announce('reveal_start',{round:state.round});
    await sleep(450);
    const r=state.lastReveal;
    while(state.phase==='reveal'&&r&&state.revealIndex<r.activeTeamIds.length){
      state=loadState();if(state.phase!=='reveal')break;
      const rr=state.lastReveal;if(!rr)break;
      const tid=rr.activeTeamIds[state.revealIndex];
      state.revealIndex++;
      saveState();render();
      await announce('pick_reveal',{round:state.round,team:team(tid)?.name,group:group(state.selections[tid])?.name});
      await sleep(600);
    }
    if(state.phase==='reveal'){await sleep(800);state=loadState();if(state.phase==='reveal')finalizeReveal()}
  }finally{revealRunner=false}
}

function currentAttempt(){return state.currentAttemptHistory[state.currentAttemptHistory.length-1]||null}

function finalizeReveal(){
  const r=state.lastReveal;if(!r)return;
  const pickGroups={};
  r.activeTeamIds.forEach(tid=>{const gid=state.selections[tid];(pickGroups[gid]??=[]).push(tid)});
  const conflicts=Object.entries(pickGroups).filter(([,ids])=>ids.length>1).map(([gid])=>gid);
  const attempt=currentAttempt();

  Object.entries(pickGroups).filter(([,ids])=>ids.length===1).forEach(([gid,ids])=>{
    const tid=ids[0];awardGroup(tid,gid,'direct');
    log(`${team(tid)?.name} が ${group(gid)?.name} を単独指名で獲得`);
  });

  if(conflicts.length){
    const gid=conflicts[0];
    state.pendingConflict={
      groupId:gid,
      teamIds:pickGroups[gid],
      remainingConflicts:conflicts.slice(1),
      selectionGroups:pickGroups,
      attemptIndex:state.currentAttemptHistory.length-1
    };
    state.phase='lottery';
    announce('conflict',{round:state.round,group:group(gid)?.name,teams:pickGroups[gid].map(id=>team(id)?.name)});
    log(`${group(gid)?.name} が ${pickGroups[gid].length}名で競合`);
    saveState();render();if(view.screen==='admin')setTimeout(openLotteryModal,80);
  }else{
    if(attempt)attempt.finalized=true;
    afterAttemptResolved();
  }
}

function afterAttemptResolved(){
  const remaining=activeTeamIds();
  state.pendingConflict=null;
  state.lastReveal=null;
  state.revealIndex=0;
  if(!remaining.length)return completeRound();

  state.roundAttempt++;
  state.selections={A:null,B:null,C:null,D:null};
  state.phase='selecting';
  log(`第${state.round}巡：残る${remaining.length}名が再指名へ`);
  saveState();render();
  announce('rebid',{round:state.round,count:remaining.length});
}

function completeRound(){
  const assignments={...state.currentRoundAssignments};
  if(Object.keys(assignments).length){
    state.board.push({
      round:state.round,
      assignments,
      attempts:JSON.parse(JSON.stringify(state.currentAttemptHistory))
    });
  }
  log(`第${state.round}巡 終了`);
  state.pendingConflict=null;
  state.selections={A:null,B:null,C:null,D:null};
  state.lastReveal=null;
  state.revealIndex=0;
  state.currentRoundAssignments={};
  state.currentAttemptHistory=[];
  state.roundAttempt=1;
  state.round++;

  if(availableGroups().length<state.teams.length){
    state.phase='complete';state.finishedAt=Date.now();
    const rem=availableGroups().length;
    log(rem?`残り${rem}グループのためドラフト終了`:'全グループの指名が完了');
    announce('complete',{eventName:state.eventName});
  }else{
    state.phase='waiting';
  }
  saveState();render();
}

function finalizeRoundAndAdvance(forced=false){
  if(Object.keys(state.currentRoundAssignments).length){
    state.board.push({round:state.round,assignments:{...state.currentRoundAssignments},attempts:JSON.parse(JSON.stringify(state.currentAttemptHistory)),forced});
  }
  state.pendingConflict=null;state.lastReveal=null;state.revealIndex=0;
  state.selections={A:null,B:null,C:null,D:null};
  state.currentRoundAssignments={};state.currentAttemptHistory=[];state.roundAttempt=1;
  state.round++;
  if(availableGroups().length<state.teams.length){state.phase='complete';state.finishedAt=Date.now();announce('complete',{eventName:state.eventName})}
  else state.phase='waiting';
  log(forced?'主催者が今巡を強制終了':'巡終了');
  saveState();render();
}

function finishDraft(manual){
  checkpoint('ドラフト終了');
  if(Object.keys(state.currentRoundAssignments).length){
    state.board.push({round:state.round,assignments:{...state.currentRoundAssignments},attempts:JSON.parse(JSON.stringify(state.currentAttemptHistory)),partial:true});
  }
  state.phase='complete';state.started=true;state.finishedAt=Date.now();state.pendingConflict=null;
  log(manual?'主催者がドラフトを終了':'グループドラフト終了');
  announce('complete',{eventName:state.eventName});saveState();render()
}
function togglePause(){if(state.phase==='paused'){checkpoint('進行再開');state.phase=state.phaseBeforePause||'waiting';state.phaseBeforePause=null;log('ドラフトを再開');saveState();render()}else{checkpoint('一時停止');state.phaseBeforePause=state.phase;state.phase='paused';log('ドラフトを一時停止');saveState();render()}}

function secureRandomInt(max){if(max<=1)return 0;try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}catch(e){return Math.floor(Math.random()*max)}}
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=secureRandomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function ensureLotteryAudio(){try{lotteryAudioCtx||=new(window.AudioContext||window.webkitAudioContext)();lotteryAudioCtx.resume?.()}catch(e){}}
function tone(freq,dur=.2,gain=.05,type='sine',delay=0){try{ensureLotteryAudio();const ctx=lotteryAudioCtx,t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(gain,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function playShuffleSound(){for(let i=0;i<12;i++)tone(180+secureRandomInt(220),.08,.035,'triangle',i*.12)}
function playEnvelopePick(){tone(330,.22,.06,'sine');tone(500,.15,.035,'sine',.08)}
function playDrumroll(){for(let i=0;i<24;i++)tone(75+secureRandomInt(35),.05,.025+i*.001,'square',i*.07)}
function playWinFanfare(){[392,523,659,784].forEach((f,i)=>tone(f,.52,.09,'triangle',i*.12))}
function playLoseSound(){tone(180,.48,.06,'sine');tone(95,.45,.04,'sine',.18)}
function playLotteryCrowd(){for(let i=0;i<22;i++)tone(120+secureRandomInt(160),.07,.02+Math.random()*.04,'square',Math.random()*1.3)}

function ensureLotteryState(c){if(!c)return null;if(!Array.isArray(c.envelopes)||c.envelopes.length!==c.teamIds.length){c.envelopes=c.teamIds.map((_,i)=>`env${i+1}`);c.displayOrder=shuffled(c.envelopes);c.winnerEnvelope=c.envelopes[secureRandomInt(c.envelopes.length)];c.assignments={};c.opened={};c.selectionIndex=0;c.winnerTeam=null;c.lotteryPhase='ready'}c.assignments||={};c.opened||={};c.selectionIndex||=0;c.lotteryPhase||='ready';return c}
function createLotteryOverlay(){let overlay=document.getElementById('lotteryOverlay');if(overlay)return overlay;overlay=document.createElement('div');overlay.id='lotteryOverlay';overlay.className='lottery-overlay';overlay.setAttribute('aria-live','assertive');overlay.innerHTML=`<div class="lottery-backdrop"></div><section class="lottery-stage"><div class="lottery-topline"><span class="kicker">NEGOTIATION RIGHTS LOTTERY</span><button id="lotteryClose" class="ghost small">抽選画面を閉じる</button></div><div id="lotteryCompetition" class="lottery-competition">競合</div><h2 id="lotteryTarget" class="lottery-target"></h2><div id="lotteryStatus" class="lottery-status"></div><div id="lotteryBoard" class="lottery-board"></div></section><div id="confetti" class="confetti"></div>`;document.body.appendChild(overlay);overlay.querySelector('#lotteryClose').onclick=()=>{if(!lotteryAnimating)overlay.classList.remove('show')};overlay.addEventListener('click',e=>{if(lotteryAnimating)return;const sh=e.target.closest('[data-shuffle]');if(sh)return shuffleConflict();const env=e.target.closest('[data-envelope-id]');if(env)return selectEnvelope(env.dataset.envelopeId,null);const op=e.target.closest('[data-open-team]');if(op)return openEnvelope(op.dataset.openTeam,null)});return overlay}
function openLotteryModal(){const c=ensureLotteryState(state.pendingConflict);if(!c)return;const o=createLotteryOverlay();renderLotteryOverlay(c);o.classList.add('show')}
function refreshLotteryOverlayIfNeeded(){const o=document.getElementById('lotteryOverlay');if(o?.classList.contains('show')&&state.phase==='lottery'&&state.pendingConflict)renderLotteryOverlay(ensureLotteryState(state.pendingConflict))}
async function shuffleConflict(){const c=ensureLotteryState(state.pendingConflict);if(!c||c.lotteryPhase!=='ready'||lotteryAnimating||state.phase==='paused')return;checkpoint('抽選シャッフル');lotteryAnimating=true;c.displayOrder=shuffled(c.envelopes);c.shuffling=true;saveState();const o=createLotteryOverlay();o.classList.add('shuffling');document.getElementById('lotteryStatus').textContent='封筒をシャッフルしています……';playShuffleSound();await sleep(2300);state=loadState();const c2=ensureLotteryState(state.pendingConflict);if(!c2){lotteryAnimating=false;return}c2.lotteryPhase='select';c2.selectionIndex=0;delete c2.shuffling;saveState();o.classList.remove('shuffling');lotteryAnimating=false;renderLotteryOverlay(c2);render()}
function selectEnvelope(envelopeId,actorTeam){const c=ensureLotteryState(state.pendingConflict);if(!c||c.lotteryPhase!=='select'||lotteryAnimating||state.phase==='paused')return;const tid=c.teamIds[c.selectionIndex];if(actorTeam&&actorTeam!==tid)return toast('現在はあなたの抽選順ではありません');if(!tid||Object.values(c.assignments).includes(envelopeId))return;checkpoint(`${team(tid)?.name||tid}封筒選択`);c.assignments[tid]=envelopeId;c.selectionIndex++;playEnvelopePick();if(c.selectionIndex>=c.teamIds.length)c.lotteryPhase='open';saveState();renderLotteryOverlay(c);render()}
async function openEnvelope(tid,actorTeam){
  const c=ensureLotteryState(state.pendingConflict);
  if(!c||c.lotteryPhase!=='open'||c.opened[tid]||!c.assignments[tid]||lotteryAnimating||c.winnerTeam||state.phase==='paused')return;
  if(actorTeam&&actorTeam!==tid)return;
  checkpoint(`${team(tid)?.name||tid}封筒開封`);
  lotteryAnimating=true;
  c.openingTeam=tid;saveState();
  const env=c.assignments[tid],isWin=env===c.winnerEnvelope;
  const o=createLotteryOverlay();
  if(o.classList.contains('show'))document.getElementById('lotteryStatus').textContent=`${team(tid)?.name||tid}、開封……`;
  o.classList.add('drumroll');playDrumroll();await sleep(1750);o.classList.remove('drumroll');
  state=loadState();const c2=ensureLotteryState(state.pendingConflict);if(!c2){lotteryAnimating=false;return}
  delete c2.openingTeam;c2.opened[tid]=isWin?'win':'lose';if(isWin)c2.winnerTeam=tid;
  saveState();renderLotteryOverlay(c2);render();
  if(isWin){
    nyouncerSpeakingPose='celebrate';updateNyouncerPose('celebrate');playWinFanfare();playLotteryCrowd();spawnConfetti();
    if(o.classList.contains('show'))document.getElementById('lotteryStatus').textContent=`🎉 ${team(tid)?.name||tid}　交渉権獲得！`;
    await sleep(500);
    await announce('lottery_win',{team:team(tid)?.name,group:group(c2.groupId)?.name});
    await sleep(900);
    state=loadState();finishCurrentConflict(ensureLotteryState(state.pendingConflict));
    nyouncerSpeakingPose=null;updateNyouncerPose();
  }else{
    playLoseSound();if(o.classList.contains('show'))document.getElementById('lotteryStatus').textContent=`${team(tid)?.name||tid}　はずれ……`;
    await sleep(900);lotteryAnimating=false;renderLotteryOverlay(c2);render()
  }
}
function renderLotteryOverlay(c){
  const o=createLotteryOverlay(),target=group(c.groupId);
  document.getElementById('lotteryTarget').textContent=target?.name||'';
  document.getElementById('lotteryCompetition').textContent=`${c.teamIds.length}名競合`;
  const status=document.getElementById('lotteryStatus'),board=document.getElementById('lotteryBoard'),chosen=new Set(Object.values(c.assignments||{}));
  if(c.lotteryPhase==='ready'){
    status.textContent=`${groupMembersLabel(c.groupId)} ／ 当たり封筒は決定済み。シャッフルして抽選を始めます。`;
    board.innerHTML=`<div class="shuffle-deck">${c.displayOrder.map((id,i)=>`<div class="envelope demo" style="--i:${i}"><span>グループ抽選</span></div>`).join('')}</div><button class="primary lottery-main-btn" data-shuffle>✉️ 封筒をシャッフルする</button>`;return
  }
  if(c.lotteryPhase==='select'){
    const tid=c.teamIds[c.selectionIndex];status.textContent=`${team(tid)?.name||tid}：封筒を1枚選択`;
    board.innerHTML=`<div class="envelope-grid">${c.displayOrder.map((id,i)=>chosen.has(id)?`<div class="envelope taken"><span>選択済み</span></div>`:`<button class="envelope pickable" data-envelope-id="${id}"><span>封筒 ${i+1}</span><small>この封筒を引く</small></button>`).join('')}</div><div class="selection-ledger">${c.teamIds.map(k=>`<div><b>${esc(team(k)?.name||k)}</b><span>${c.assignments[k]?'✓ 選択済':'待機中'}</span></div>`).join('')}</div>`;return
  }
  status.textContent=c.winnerTeam?`${team(c.winnerTeam)?.name} が当選！`:'好きな順に封筒を開封してください。';
  const unopened=c.teamIds.filter(k=>!c.opened[k]),allLose=c.teamIds.filter(k=>c.opened[k]).every(k=>c.opened[k]==='lose');
  board.innerHTML=`<div class="owned-envelopes">${c.teamIds.map(k=>{const result=c.opened[k],lastCertain=unopened.length===1&&unopened[0]===k&&allLose;return`<button class="owned-envelope ${result||''}" data-open-team="${k}" ${result||c.winnerTeam?'disabled':''}><span class="owner">${esc(team(k)?.name||k)}</span><span class="paper">${result==='win'?'グループ獲得':result==='lose'?'はずれ':lastCertain?'当たり確定…？':'封筒を開ける'}</span><small>${result?'開封済み':'タップして開封'}</small></button>`}).join('')}</div>`
}
function spawnConfetti(){const box=document.getElementById('confetti');if(!box)return;box.innerHTML='';for(let i=0;i<70;i++){const s=document.createElement('i');s.style.left=`${secureRandomInt(100)}%`;s.style.setProperty('--delay',`${secureRandomInt(600)}ms`);s.style.setProperty('--drift',`${secureRandomInt(240)-120}px`);s.style.setProperty('--spin',`${360+secureRandomInt(720)}deg`);box.appendChild(s)}setTimeout(()=>{if(box)box.innerHTML=''},3200)}
function finishCurrentConflict(c){
  if(!c?.winnerTeam){lotteryAnimating=false;return}
  const winnerId=c.winnerTeam,gid=c.groupId,wt=team(winnerId),g=group(gid);
  awardGroup(winnerId,gid,'lottery-win');
  const attempt=currentAttempt();
  c.teamIds.forEach(tid=>{
    if(attempt?.results?.[tid])Object.assign(attempt.results[tid],{mode:tid===winnerId?'lottery-win':'lottery-lose',acquired:tid===winnerId});
  });
  log(`抽選結果：${wt?.name} が ${g?.name} を獲得`);

  const remain=c.remainingConflicts||[];
  if(remain.length){
    const nextGid=remain[0];
    state.pendingConflict={
      groupId:nextGid,
      teamIds:c.selectionGroups[nextGid],
      remainingConflicts:remain.slice(1),
      selectionGroups:c.selectionGroups,
      attemptIndex:c.attemptIndex
    };
    state.phase='lottery';
    announce('conflict',{round:state.round,group:group(nextGid)?.name,teams:c.selectionGroups[nextGid].map(id=>team(id)?.name)});
  }else{
    if(attempt)attempt.finalized=true;
    state.pendingConflict=null;
  }

  saveState();
  const o=document.getElementById('lotteryOverlay');if(o)o.classList.remove('show');
  lotteryAnimating=false;
  render();
  toast(`${wt?.name} が ${g?.name} を獲得しました`);

  if(state.phase==='lottery'&&state.pendingConflict){
    if(view.screen==='admin')setTimeout(openLotteryModal,300);
  }else{
    afterAttemptResolved();
  }
}

function downloadResultImage(){
  const c=document.createElement('canvas');c.width=1600;c.height=1120;const x=c.getContext('2d');
  x.fillStyle='#f1e5d0';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#202523';x.fillRect(0,0,c.width,175);
  x.fillStyle='#ffd16c';x.font='800 54px sans-serif';x.fillText(state.eventName,70,82);
  x.fillStyle='#e9ddc7';x.font='700 25px sans-serif';x.fillText('NYOUNCER GROUP DRAFT RESULT',72,126);

  const positions=[[70,220],[820,220],[70,660],[820,660]];
  state.teams.forEach((t,i)=>{
    const [left,top]=positions[i];
    x.fillStyle='#fffaf0';x.fillRect(left,top,710,390);
    x.strokeStyle='#d9b66f';x.lineWidth=3;x.strokeRect(left,top,710,390);
    x.fillStyle='#272a27';x.font='800 31px sans-serif';x.fillText(t.name,left+28,top+48);
    x.fillStyle='#756e64';x.font='18px sans-serif';x.fillText(`操作：${person(t.leaderId)?.name||''}`,left+28,top+78);
    let y=top+122;
    t.groupsWon.forEach((gid,idx)=>{
      const g=group(gid);x.fillStyle='#a7640e';x.font='800 22px sans-serif';x.fillText(`${idx+1}. ${g?.name||gid}`,left+30,y);
      x.fillStyle='#514c44';x.font='16px sans-serif';
      const members=groupMembersLabel(gid);const chunks=[];
      for(let p=0;p<members.length;p+=32)chunks.push(members.slice(p,p+32));
      chunks.slice(0,2).forEach((line,j)=>x.fillText(line,left+54,y+25+j*21));
      y+=78;
    });
  });
  x.fillStyle='#7b6f5e';x.font='16px sans-serif';x.fillText(`Generated ${new Date().toLocaleString('ja-JP')}`,70,1090);
  const a=document.createElement('a');a.download=`${state.eventName.replace(/[\\/:*?"<>|]/g,'_')}_結果.png`;a.href=c.toDataURL('image/png');a.click()
}

(async()=>{
  await initOnlineMode();
  render();
  if(isOnlineHost()&&onlineSession.connected)onlineBroadcastSnapshots();
})();

</script>
